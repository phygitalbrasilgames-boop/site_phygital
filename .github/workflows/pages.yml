name: Publicar site no GitHub Pages

# Mantém o branch gh-pages com o conteúdo de site/ na raiz.
#
# Por que não usa actions/configure-pages, upload-pages-artifact e deploy-pages:
# essas três falharam repetidamente no download (codeload devolvendo 429 e 503),
# derrubando a publicação por instabilidade de infraestrutura, não por erro de
# configuração. Aqui só o checkout é uma action; o resto é git puro, que não
# depende do codeload.
#
# Configuração necessária no repositório, uma única vez:
#   Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages · pasta: / (root)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar site/ na raiz do branch gh-pages
        run: |
          set -euo pipefail

          # A árvore de site/ já está no commit; basta reaproveitá-la em vez de
          # copiar arquivo por arquivo.
          arvore_site=$(git rev-parse HEAD:site)

          export GIT_INDEX_FILE="$RUNNER_TEMP/indice-ghpages"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$arvore_site"

          # Impede o Jekyll de reprocessar os arquivos publicados.
          : > "$RUNNER_TEMP/nojekyll"
          blob=$(git hash-object -w "$RUNNER_TEMP/nojekyll")
          git update-index --add --cacheinfo 100644,"$blob",.nojekyll

          arvore=$(git write-tree)

          # Encadeia no gh-pages anterior quando ele existe, para preservar o
          # histórico das publicações.
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            pai="-p $(git rev-parse refs/remotes/origin/gh-pages)"
          else
            pai=""
          fi

          commit=$(git commit-tree "$arvore" $pai \
            -m "Publica site/ ($(git rev-parse --short HEAD))")

          git push origin "$commit:refs/heads/gh-pages"

          echo "Publicado: $commit"
